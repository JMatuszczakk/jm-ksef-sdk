name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # No `registry-url` here on purpose: setup-node auto-injects NODE_AUTH_TOKEN
      # (defaulting to the ambient GITHUB_TOKEN) into .npmrc whenever registry-url
      # is set, which npm then tries as a bearer token — it's invalid for the npm
      # registry, publish fails as unauthorized, and OIDC trusted publishing never
      # gets a chance to kick in. npm's default registry is already npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      # Trusted publishing (OIDC) requires npm CLI >= 11.5.0 — newer than what
      # setup-node's bundled Node currently ships.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
